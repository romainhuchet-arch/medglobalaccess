name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: ruff check src app tests
      - name: Tests (hors ligne)
        env:
          PYTHONPATH: src
          FORCE_SYNTHETIC: "true"
        run: python -m pytest -q
